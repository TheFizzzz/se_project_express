pid .local-deploy/nginx.pid;
error_log .local-deploy/nginx-error.log;

events {}

http {
  access_log .local-deploy/nginx-access.log;

  server {
    listen 8080;
    server_name localhost;
    return 301 https://localhost:8443$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate .local-deploy/certs/localhost.crt;
    ssl_certificate_key .local-deploy/certs/localhost.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://127.0.0.1:3001;
    }
  }
}
